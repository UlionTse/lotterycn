repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        pass_filenames: false  # mypy config (pyproject) owns the file list
        files: ^lotterycn/
        additional_dependencies:
          - pandas>=2.3.3
          - numpy>=1.26.4
          - requests>=2.34.2
          - rich>=15.0.0
