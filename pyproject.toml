[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lotterycn"
description = "A Python library for enjoyable analysis of Chinese welfare & sports lotteries."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ulion.Tse", email = "uliontse@outlook.com" },
]
keywords = ["lottery"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=15.0.0",
    "pandas>=2.3.3",
    "numpy>=1.26.4",
    "requests>=2.34.2",
]
dynamic = ["version"]

[project.optional-dependencies]
pypi = ["build>=1.6.1", "twine>=7.0.0"]
docs = ["mkdocs-material>=9.7.7", "mkdocstrings[python]>=1.0.6", "mkdocs-static-i18n>=1.3.1"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]

[project.scripts]
lotterycn = "lotterycn.cli:main"

[project.urls]
Homepage = "https://github.com/uliontse/lotterycn"
Source = "https://github.com/UlionTse/lotterycn"
Changelog = "https://github.com/UlionTse/lotterycn/blob/main/CHANGELOG.md"
Documentation = "https://uliontse.github.io/lotterycn/"

[tool.setuptools]
packages = ["lotterycn"]

[tool.setuptools.package-data]
lotterycn = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "lotterycn.__version__" }

[tool.isort]
src_paths = ["lotterycn"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["lotterycn", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# 已 ruff format 全量格式化，E501 全局启用；唯一的超长行（User-Agent 字符串）以 noqa 豁免Agent 字符串）以 noqa 豁免Agent 字符串）以 noqa 豁免

[tool.ruff.lint.isort]
known-first-party = ["lotterycn"]

[tool.mypy]
files = ["lotterycn"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
# 子类按彩种收窄 get_odds_dataframe/get_expectation_dataframe 的参数签名属有意设计，
# 运行时由 _get_pac 工厂保证只传入受支持的参数
disable_error_code = ["override"]
exclude = ["build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 联网用例默认跳过，需要时显式执行：pytest -m network
addopts = "-m 'not network'"
markers = [
    "network: tests that require internet access (run with: pytest -m network)",
]

[tool.coverage.report]
# 低于门槛即失败；随测试补充逐步上调
fail_under = 80
