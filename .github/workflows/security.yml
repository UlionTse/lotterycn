name: Security

# Weekly dependency audit with pip-audit (known vulnerabilities in the dependency tree).
# Blocking by design: the scheduled run turns red when an advisory hits, acting as the
# alert signal. PR CI does not run the audit (transient advisories must not block
# merges); dependency updates are handled by Dependabot.
on:
  schedule:
    - cron: '0 19 * * 4'  # Fridays 03:00 Beijing time (UTC+8)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit
      - name: Dependency security scan
        run: pip-audit --skip-editable
