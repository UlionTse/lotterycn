name: Release

# Release 驱动的可信发布：GitHub Release 被点击 Publish 后，构建并上传 PyPI。
# 双语草稿 Release 由 prepare-release.yml（tag 推送触发）自动创建并预填 notes。
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard - tag must match __version__
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' lotterycn/__init__.py)"
          echo "tag=${TAG_VERSION} package=${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::tag v${TAG_VERSION} does not match __version__ ${PKG_VERSION}"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
